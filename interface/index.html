<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle recherche</title>
    <style>
        :root {
            --bg-color: #e9eaed;          /* clair adouci (pas blanc pur) */
            --text-color: #202124;
            --logo-text-color: #5f6368;
            --search-bg: #ffffff;
            --search-border: #d2d5d9;
            --search-shadow: 0 1px 10px rgba(26, 115, 232, 0.25);
            --icon-color: #9aa0a6;
        }
        body.dark-mode {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --logo-text-color: #e8eaed;
            --search-bg: #303134;
            --search-border: #5f6368;
            --search-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
            --icon-color: #bdc1c6;
        }

        .gradient-text {
            background: linear-gradient(90deg, #4898ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        main {
            flex-grow: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding-bottom: 16vh;
        }

        h1 {
            font-size: 72px; font-weight: 400;
            margin-bottom: 34px;
            color: var(--logo-text-color);
            letter-spacing: -0.5px;
        }

        .search-form { width: 100%; max-width: 580px; margin: 0 auto; position: relative; }
        .search-bar-wrapper { position: relative; }
        #search-input { position: relative; z-index: 2; }
        .search-bar-wrapper .magnifier, .search-bar-wrapper .ai-toggle { z-index: 3; }

        /* ---------- Bouton IA + bordure degrade (zaalis labs ide) ---------- */
        .search-bar-wrapper .ai-toggle {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--icon-color); z-index: 3;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .search-bar-wrapper .ai-toggle:hover { background: rgba(127,127,127,0.15); color: #1a73e8; }
        .search-bar-wrapper .ai-toggle.off { color: var(--icon-color); opacity: .48; }
        body.dark-mode .search-bar-wrapper .ai-toggle:hover { color: #8ab4f8; }
        .search-bar-wrapper .ai-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
        .search-bar-wrapper.ai .ai-toggle { color: #4898ff; }
        .search-bar-wrapper.ai .ai-toggle svg { filter: drop-shadow(0 0 5px rgba(72,152,255,.55)); }
        /* Mode IA : pas de lisere ni d'anneau — le degrade emane directement
           du bord de la barre (aucune demarcation entre la barre et le halo). */
        .search-bar-wrapper.ai #search-input {
            border-color: transparent;
            box-shadow: none;
        }
        body.dark-mode .search-bar-wrapper.ai #search-input {
            border-color: transparent;
            box-shadow: none;
        }
        .search-bar-wrapper.ai::before {
            content: ""; position: absolute; inset: -2px; border-radius: 26px;
            background: linear-gradient(90deg, rgba(0,120,255,.85), rgba(0,212,255,.85), rgba(120,90,255,.85), rgba(0,212,255,.85), rgba(0,120,255,.85));
            background-size: 200% 100%;
            filter: blur(14px); opacity: .8;
            animation: ai-flow 7s linear infinite; pointer-events: none; z-index: 1;
        }
        /* Boucle sans couture : palindrome + defilement d'exactement une tuile
           (200% avec background-size 200%, l'arriere-plan se repete). */
        @keyframes ai-flow { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }

        /* ---------- Raccourcis (facon Google) ---------- */
        .shortcuts {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 20px; margin-top: 36px; max-width: 620px;
        }
        .shortcut {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            width: 72px; position: relative; cursor: pointer;
        }
        .shortcut-icon {
            width: 46px; height: 46px; border-radius: 50%;
            background: var(--search-bg); box-shadow: 0 1px 3px rgba(0,0,0,.15);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative; transition: box-shadow .15s ease;
        }
        .shortcut:hover .shortcut-icon { box-shadow: 0 1px 8px rgba(0,0,0,.25); }
        .shortcut-icon .fallback {
            display: none; position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(90deg, #4898ff, #00ffff);
        }
        .shortcut-icon .fallback.show { display: block; }
        .shortcut-icon img { position: relative; width: 22px; height: 22px; object-fit: contain; }
        .shortcut-label {
            font-size: 12px; color: var(--text); max-width: 72px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .shortcut-remove {
            position: absolute; top: -4px; right: 6px; width: 20px; height: 20px;
            border-radius: 50%; background: var(--search-bg); color: var(--icon-color);
            display: none; align-items: center; justify-content: center;
            font-size: 13px; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }
        .shortcut:hover .shortcut-remove { display: flex; }
        .shortcut-remove:hover { color: #d93025; }
        .add-shortcut .shortcut-icon { background: transparent; box-shadow: inset 0 0 0 1px var(--search-border); }
        .add-shortcut:hover .shortcut-icon { box-shadow: inset 0 0 0 1px var(--icon-color); }
        .add-shortcut .shortcut-icon svg { width: 18px; height: 18px; stroke: var(--icon-color); fill: none; stroke-width: 2; stroke-linecap: round; }

        .search-bar-wrapper .magnifier {
            position: absolute; left: 8px; top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--icon-color);
            transition: background 0.15s ease, color 0.15s ease;
        }
        .search-bar-wrapper .magnifier:hover { background: rgba(127,127,127,0.15); color: #1a73e8; }
        body.dark-mode .search-bar-wrapper .magnifier:hover { color: #8ab4f8; }
        .search-bar-wrapper .magnifier svg { width: 20px; height: 20px; fill: currentColor; }

        #search-input {
            width: 100%;
            padding: 13px 52px 13px 52px;
            font-size: 16px;
            border: 1px solid var(--search-border);
            border-radius: 24px;
            background-color: var(--search-bg);
            color: var(--text-color);
            box-sizing: border-box; outline: none;
            transition: all 0.2s ease;
        }
        #search-input:focus { border-color: transparent; box-shadow: var(--search-shadow); }

        /* ---------- Suggestions de saisie (facon Google) ---------- */
        .home-suggest {
            position: absolute; top: 100%; left: 0; right: 0; margin-top: 10px;
            z-index: 5;
            background: var(--search-bg);
            border: 1px solid var(--search-border);
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0,0,0,.16);
            padding: 6px; overflow: hidden; text-align: left;
            opacity: 0; pointer-events: none;
            transform: translateY(-6px);
            transition: opacity .15s cubic-bezier(.2,.8,.2,1), transform .15s cubic-bezier(.2,.8,.2,1);
        }
        body.dark-mode .home-suggest { box-shadow: 0 8px 28px rgba(0,0,0,.5); }
        .search-form.suggest-open .home-suggest { opacity: 1; pointer-events: auto; transform: none; }
        .hs-item {
            display: flex; align-items: center; gap: 14px;
            padding: 9px 14px; border-radius: 12px; font-size: 15px;
            white-space: nowrap; overflow: hidden; cursor: pointer;
            color: var(--icon-color); transition: background .1s ease;
        }
        .hs-item .hs-ic { width: 18px; height: 18px; flex: none; display: flex; color: var(--icon-color); }
        .hs-item .hs-ic svg { width: 18px; height: 18px; fill: currentColor; }
        .hs-item .hs-tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--icon-color); }
        .hs-item .hs-tx b { font-weight: 600; color: var(--text-color); }
        .hs-item.sel { background: rgba(127,127,127,.13); }

        /* ---------- Modale « Ajouter un raccourci » ---------- */
        .modal-mask {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(0,0,0,.28);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity .16s ease;
        }
        body.modal-open .modal-mask { opacity: 1; pointer-events: auto; }
        .modal {
            width: 380px; max-width: calc(100vw - 32px);
            background: var(--search-bg); color: var(--text-color);
            border-radius: 16px; padding: 22px 24px 18px;
            box-shadow: 0 18px 50px rgba(0,0,0,.32);
            transform: translateY(8px) scale(.98); transition: transform .16s cubic-bezier(.2,.8,.2,1);
        }
        body.modal-open .modal { transform: none; }
        .modal h2 { margin: 0 0 18px; font-size: 20px; font-weight: 500; color: var(--text-color); }
        .modal-field { margin-bottom: 16px; }
        .modal-field input {
            width: 100%; box-sizing: border-box; padding: 12px 14px;
            font-size: 15px; font-family: inherit; color: var(--text-color);
            background: transparent; border: 1px solid var(--search-border);
            border-radius: 10px; outline: none; transition: border-color .15s ease;
        }
        .modal-field input:focus { border-color: #1a73e8; }
        body.dark-mode .modal-field input:focus { border-color: #8ab4f8; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .modal-btn {
            padding: 9px 20px; border-radius: 999px; border: none; cursor: pointer;
            font-size: 14px; font-family: inherit; font-weight: 500; background: transparent;
            color: #1a73e8;
        }
        body.dark-mode .modal-btn { color: #8ab4f8; }
        .modal-btn:hover { background: rgba(26,115,232,.10); }
        .modal-btn.primary { color: #fff; background: #1a73e8; }
        .modal-btn.primary:hover { background: #1765cc; }
        .modal-btn.primary:disabled { background: var(--search-border); color: var(--icon-color); cursor: default; }
    </style>
</head>
<body>
    <main>
        <h1>
            <span class="gradient-text">
                <span>Z</span><span>A</span><span>A</span><span>L</span><span>I</span><span>S</span>
            </span> Search
        </h1>

        <form class="search-form" id="search-form">
            <div class="search-bar-wrapper">
                <div class="magnifier" id="magnifier" title="Rechercher avec Google">
                    <svg focusable="false" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                    </svg>
                </div>
                <input type="text" id="search-input" autocomplete="off" autofocus
                       placeholder="Rechercher sur Google ou saisir une URL">
                <div class="ai-toggle" id="ai-toggle" title="Recherche IA — zaalis labs ide">
                    <svg focusable="false" viewBox="0 0 24 24"><path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15.6l-1.7-4.6L6 9.3l4.3-1.7z"/><path d="M18.5 14.2l.85 2.05 2.05.85-2.05.85-.85 2.05-.85-2.05-2.05-.85 2.05-.85z"/></svg>
                </div>
            </div>
            <div class="home-suggest" id="home-suggest"></div>
        </form>

        <div class="shortcuts" id="shortcuts"></div>
    </main>

    <div class="modal-mask" id="modal-mask">
        <div class="modal" id="modal">
            <h2 id="modal-title">Ajouter un raccourci</h2>
            <div class="modal-field"><input id="modal-name" type="text" placeholder="Nom" autocomplete="off"></div>
            <div class="modal-field"><input id="modal-url" type="text" placeholder="URL" autocomplete="off"></div>
            <div class="modal-actions">
                <button class="modal-btn" id="modal-cancel">Annuler</button>
                <button class="modal-btn primary" id="modal-ok" disabled>OK</button>
            </div>
        </div>
    </div>

    <script>
        const wv = window.chrome && window.chrome.webview;
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const wrapper = document.querySelector('.search-bar-wrapper');
        const aiToggle = document.getElementById('ai-toggle');
        let aiMode = false;

        function setAiMode(on) {
            aiMode = !!on;
            wrapper.classList.toggle('ai', aiMode);
            input.placeholder = aiMode
                ? "Rechercher avec zaalis labs ide — IA"
                : "Rechercher sur Google ou saisir une URL";
        }
        // Pousse par le natif via preload : indique si l'IA est utilisable.
        let aiConnected = true;
        aiToggle.addEventListener('click', () => {
          if (!aiConnected) {
            // Petit hochement + ouvre les reglages du navigateur.
            aiToggle.animate([{transform:'translateY(-50%) translateX(0)'},{transform:'translateY(-50%) translateX(-3px)'},{transform:'translateY(-50%) translateX(3px)'},{transform:'translateY(-50%) translateX(0)'}], {duration:220});
            if (wv) wv.postMessage('togglePanel');
            return;
          }
          // Etat unique cote natif : rediffuse a la barre d'adresse ET a
          // l'accueil pour que le degrade IA s'allume sur les deux barres.
          if (wv) wv.postMessage("setAiMode" + "\x1f" + (aiMode ? "0" : "1"));
          input.focus();
        });

        function launch() {
            const v = input.value.trim();
            if (!v) return;
            closeSuggest();
            // En mode IA : la recherche est confiee a zaalis labs ide.
            // Sinon, le code natif decide : navigation directe ou recherche.
            if (wv) wv.postMessage((aiMode ? "aiSearch" : "navigate") + "\x1f" + v);
        }

        form.addEventListener('submit', (e) => { e.preventDefault(); launch(); });
        document.getElementById('magnifier').addEventListener('click', launch);

        // Theme injecte par le natif (localStorage) avant le chargement.
        (function () {
            const t = localStorage.getItem('zaalis_theme') || 'light';
            if (t === 'dark') document.body.classList.add('dark-mode');
        })();

        // ---------- Raccourcis ----------
        const shortcutsEl = document.getElementById('shortcuts');

        function faviconUrl(u) {
            try { return "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(new URL(u).hostname); }
            catch (e) { return ""; }
        }

        function renderShortcuts(items) {
            shortcutsEl.innerHTML = "";
            (items || []).forEach(it => {
                const el = document.createElement("div");
                el.className = "shortcut"; el.title = it.url;
                const icon = document.createElement("div"); icon.className = "shortcut-icon";
                const fallback = document.createElement("div"); fallback.className = "fallback"; icon.appendChild(fallback);
                const src = faviconUrl(it.url);
                if (src) {
                    const img = document.createElement("img"); img.alt = "";
                    img.onerror = () => { img.remove(); fallback.classList.add("show"); };
                    img.src = src;
                    icon.appendChild(img);
                } else {
                    fallback.classList.add("show");
                }
                el.appendChild(icon);
                const label = document.createElement("div"); label.className = "shortcut-label";
                label.textContent = it.title && it.title.trim() ? it.title : new URL(it.url).hostname.replace(/^www\./, "");
                el.appendChild(label);
                const rm = document.createElement("div"); rm.className = "shortcut-remove"; rm.textContent = "×";
                rm.onclick = (e) => { e.stopPropagation(); if (wv) wv.postMessage("removeShortcut" + "\x1f" + it.url); };
                el.appendChild(rm);
                el.onclick = () => { if (wv) wv.postMessage("navigate\x1f" + it.url); };
                shortcutsEl.appendChild(el);
            });

            const add = document.createElement("div");
            add.className = "shortcut add-shortcut"; add.title = "Ajouter un raccourci";
            add.innerHTML = '<div class="shortcut-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="shortcut-label">Ajouter</div>';
            add.onclick = () => openShortcutModal();
            shortcutsEl.appendChild(add);
        }

        function applyAiConnected(on, message) {
            aiConnected = !!on;
            aiToggle.classList.toggle('off', !on);
            aiToggle.title = on ? "Recherche IA — zaalis labs ide"
                                : (message || "IA indisponible : zaalis labs ide non joignable.");
        }
        if (wv) wv.addEventListener('message', e => {
            const d = e.data;
            if (!d) return;
            if (d.type === 'shortcuts') renderShortcuts(d.items);
            else if (d.type === 'aiStatus') applyAiConnected(d.connected, d.message);
            else if (d.type === 'aiMode') setAiMode(d.on);
            else if (d.type === 'suggest') onSuggest(d);
        });
        // ---------- Suggestions de saisie (facon Google) ----------
        const suggestBox = document.getElementById('home-suggest');
        const HS_SEARCH = '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>';
        let sItems = [], sSel = -1, sOpen = false, sSeq = 0, sSeen = 0, sTimer = 0, sQuery = "", sTyped = "";

        function escHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
        function highlightSuggest(text, q){
            q = (q || "").trim();
            if (q && text.toLowerCase().startsWith(q.toLowerCase()))
                return escHtml(text.slice(0, q.length)) + "<b>" + escHtml(text.slice(q.length)) + "</b>";
            return "<b>" + escHtml(text) + "</b>";
        }
        function updateSuggestSel(){ [...suggestBox.children].forEach((c, i) => c.classList.toggle("sel", i === sSel)); }
        function requestSuggest(q){
            q = (q || "").trim();
            sQuery = q;
            if (!q || /^[a-z][a-z0-9+.\-]*:\/\//i.test(q)) { closeSuggest(); return; }
            if (wv) wv.postMessage("suggest\x1f" + (++sSeq) + "\x1f" + q);
        }
        function onSuggest(d){
            const seq = Number(d.seq) || 0;
            if (seq < sSeen) return;
            sSeen = seq;
            if (d.query !== sQuery) return;
            if (document.activeElement !== input) return;
            sItems = Array.isArray(d.items) ? d.items.slice(0, 8) : [];
            sSel = -1;
            renderSuggest();
        }
        function renderSuggest(){
            if (!sItems.length) { closeSuggest(); return; }
            suggestBox.innerHTML = "";
            sItems.forEach((s, i) => {
                const it = document.createElement("div");
                it.className = "hs-item" + (i === sSel ? " sel" : "");
                it.innerHTML = '<span class="hs-ic">' + HS_SEARCH + '</span><span class="hs-tx">' + highlightSuggest(s, sTyped) + '</span>';
                it.addEventListener("mousedown", (e) => { e.preventDefault(); input.value = s; closeSuggest(); launch(); });
                it.addEventListener("mouseenter", () => { sSel = i; updateSuggestSel(); });
                suggestBox.appendChild(it);
            });
            if (!sOpen) { sOpen = true; form.classList.add("suggest-open"); }
        }
        function closeSuggest(){
            if (!sOpen && !sItems.length) return;
            sOpen = false; sItems = []; sSel = -1;
            form.classList.remove("suggest-open");
        }

        input.addEventListener('input', () => {
            sSel = -1; sTyped = input.value;
            clearTimeout(sTimer);
            const q = input.value;
            sTimer = setTimeout(() => requestSuggest(q), 110);
        });
        input.addEventListener('keydown', (e) => {
            if ((e.key === "ArrowDown" || e.key === "ArrowUp") && sOpen) {
                e.preventDefault();
                const dir = e.key === "ArrowDown" ? 1 : -1;
                sSel = Math.max(-1, Math.min(sItems.length - 1, sSel + dir));
                input.value = sSel >= 0 ? sItems[sSel] : sTyped;
                updateSuggestSel();
            } else if (e.key === "Enter") {
                if (sOpen && sSel >= 0) input.value = sItems[sSel];
                closeSuggest();   // launch() est declenche par le submit du formulaire
            } else if (e.key === "Escape") {
                if (sOpen) { e.preventDefault(); closeSuggest(); }
            }
        });
        input.addEventListener('blur', () => setTimeout(closeSuggest, 120));
        document.addEventListener('pointerdown', (e) => {
            if (sOpen && !e.target.closest('#home-suggest, #search-input')) closeSuggest();
        });

        // ---------- Modale « Ajouter un raccourci » ----------
        const modalMask = document.getElementById('modal-mask');
        const mName = document.getElementById('modal-name');
        const mUrl  = document.getElementById('modal-url');
        const mOk   = document.getElementById('modal-ok');
        const mCancel = document.getElementById('modal-cancel');

        function openShortcutModal(){
            mName.value = ""; mUrl.value = ""; mOk.disabled = true;
            document.body.classList.add('modal-open');
            setTimeout(() => mName.focus(), 30);
        }
        function closeShortcutModal(){ document.body.classList.remove('modal-open'); }
        function validModal(){ mOk.disabled = !mUrl.value.trim(); }
        function submitModal(){
            const url = mUrl.value.trim();
            if (!url) return;
            const name = mName.value.trim();
            if (wv) wv.postMessage("addShortcut\x1f" + url + "\x1f" + name);
            closeShortcutModal();
        }
        mUrl.addEventListener('input', validModal);
        mOk.addEventListener('click', submitModal);
        mCancel.addEventListener('click', closeShortcutModal);
        modalMask.addEventListener('pointerdown', (e) => { if (e.target === modalMask) closeShortcutModal(); });
        [mName, mUrl].forEach(el => el.addEventListener('keydown', (e) => {
            if (e.key === "Enter") { e.preventDefault(); submitModal(); }
            else if (e.key === "Escape") { e.preventDefault(); closeShortcutModal(); }
        }));

        if (wv) wv.postMessage('ready');
    </script>
</body>
</html>
