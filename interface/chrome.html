<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --sep: 1rem;
    --bookmarks-bar-height: 60px;
  }
  /* ----- Theme clair (adouci, pas blanc pur) ----- */
  body {
    --bg:        #dfe1e5;
    --bar:       #e8eaed;
    --surface:   #f1f3f4;
    --surface-h: #e2e5e9;
    --active:    #f7f8fa;
    --text:      #202124;
    --muted:     #5f6368;
    --border:    #d2d5d9;
    --input-bg:  #ffffff;
    --accent:    #1a73e8;
    --danger:    #d93025;
  }
  /* ----- Theme sombre (noir) ----- */
  body.dark {
    --bg:        #191a1c;
    --bar:       #202124;
    --surface:   #303134;
    --surface-h: #3c4043;
    --active:    #35363a;
    --text:      #e8eaed;
    --muted:     #9aa0a6;
    --border:    #3c4043;
    --input-bg:  #303134;
    --accent:    #8ab4f8;
    --danger:    #f28b82;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: transparent;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Barre d'onglets ---------- */
  .tabstrip {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 40px;
    padding: 6px 8px 0 8px;
    background: var(--bg);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 4px 6px;
  }
  .brand img { height: 24px; width: auto; max-width: 44px; border-radius: 5px; object-fit: contain; display: block; }
  .brand span {
    font-weight: 600; font-size: 13px; letter-spacing: .3px;
    background: linear-gradient(90deg, #4898ff, #00ffff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  /* La bande d'onglets ne prend que la place de ses onglets : le bouton "+"
     reste ainsi colle au dernier onglet (comme Chrome), et l'espace restant
     est un vide deplacable pour la fenetre. */
  .tabs { display: flex; align-items: flex-end; gap: 4px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
  /* Fin separateur entre le dernier onglet et le "+". */
  .tabstrip-sep {
    width: 1px; height: 18px; flex: none;
    margin: 0 3px 8px; border-radius: 1px;
    background: var(--border);
  }
  .tabstrip-fill { flex: 1 1 auto; min-width: 0; height: 100%; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    height: 34px; width: 240px; min-width: 72px; max-width: 240px; flex: 1 1 240px;
    padding: 0 8px 0 12px;
    background: var(--surface);
    border-radius: 12px 12px 0 0;
    font-size: 13px; color: var(--muted);
    cursor: default; position: relative;
    transition: background .15s ease, color .15s ease, transform .18s ease, box-shadow .15s ease;
  }
  .tab:hover { background: var(--surface-h); }
  /* Après un clic droit, macOS n'émet pas pointerleave quand le menu natif
     s'ouvre : la tab garderait le fond gris du :hover. On le neutralise. */
  .tab.suppress-hover:hover { background: var(--bar); }
  .tab.suppress-hover.active:hover { background: var(--active); }
  .tab.active {
    background: var(--active); color: var(--text); font-weight: 500;
    box-shadow: 0 -1px 0 rgba(0,0,0,.03), 0 -3px 10px rgba(0,0,0,.06);
  }
  /* Les onglets non selectionnes reprennent exactement la teinte de la
     barre d'outils ; l'onglet actif reste ainsi le seul mis en avant. */
  .tab:not(.active):not(.split) { background: var(--bar); }
  .tab.suppress-hover:not(.active):not(.split):hover { background: var(--bar); }
  .tab.dragging { box-shadow: 0 6px 18px rgba(0,0,0,.30); cursor: grabbing; z-index: 10; }
  /* Onglets lies par la vue fractionnee : les deux membres forment un groupe
     compact (facon Google) qui occupe ~la largeur d'un seul onglet, pas deux.
     Chaque membre se reduit a sa favicon (+ fermer au survol). */
  .tab.split {
    position: relative;
    width: 54px; min-width: 54px; max-width: 54px; flex: 0 0 54px;
    padding: 0 6px; justify-content: center;
    background: linear-gradient(180deg, rgba(72,152,255,.10), rgba(0,212,255,.14));
  }
  .tab.split .title { display: none; }
  .tab.split .tab-fav {
    width: 16px; height: 16px; border-radius: 4px; flex: none;
    position: relative; overflow: hidden;
  }
  .tab.split .tab-fav.fallback { background: linear-gradient(90deg, #4898ff, #00ffff); }
  .tab.split .tab-fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Fermer masque au repos, apparait au survol par-dessus la favicon. */
  .tab.split .close {
    position: absolute; top: 50%; right: 4px; transform: translateY(-50%);
    width: 16px; height: 16px; opacity: 0; transition: opacity .12s ease;
    background: var(--surface-h);
  }
  .tab.split:hover .close { opacity: 1; }
  .tab.split:hover { background: linear-gradient(180deg, rgba(72,152,255,.16), rgba(0,212,255,.22)); }
  .tab.split.active {
    background: linear-gradient(180deg, rgba(72,152,255,.22), rgba(0,212,255,.30));
    box-shadow: 0 -1px 0 rgba(0,0,0,.03), 0 -3px 10px rgba(0,0,0,.06);
  }
  .tab.split::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: 4px;
    height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, #4898ff, #00d4ff);
    box-shadow: 0 0 6px rgba(72,152,255,.55);
  }
  body.dark .tab.split { background: linear-gradient(180deg, rgba(138,180,248,.14), rgba(0,212,255,.16)); }
  body.dark .tab.split.active { background: linear-gradient(180deg, rgba(138,180,248,.26), rgba(0,212,255,.34)); }
  /* Les deux onglets fractionnes sont colles bord a bord (pas d'ecart entre
     eux) : on annule le gap du conteneur et les angles internes. */
  .tab.split-l { border-top-right-radius: 0; }
  .tab.split-r { border-top-left-radius: 0; margin-left: -4px; }
  .tab.split-l::after { right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tab.split-r::after { left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .tab .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-fav {
    width: 16px; height: 16px; border-radius: 4px; flex: none;
    position: relative; overflow: hidden;
  }
  .tab-fav.fallback { background: linear-gradient(90deg, #4898ff, #00ffff); }
  .tab-fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tab .close {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; color: var(--muted);
    flex: none;
  }
  .tab .close:hover { background: var(--surface-h); color: var(--text); }
  .tab.active .close:hover { background: var(--surface); }
  .newtab {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--muted); margin-bottom: 2px; flex: none;
  }
  .newtab:hover { background: var(--surface-h); color: var(--text); }

  /* ---------- Barre d'outils ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 6px;
    height: 52px; padding: 0 12px;
    background: var(--bar);
  }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); flex: none;
    transition: background .12s ease, opacity .12s ease,
                transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  .iconbtn:hover { background: var(--surface-h); }
  .iconbtn:active { transform: scale(.82); }
  .iconbtn.disabled { opacity: .32; pointer-events: none; }
  /* Fonctions IA quand l'IDE n'est pas joignable : cliquable mais grise. */
  .iconbtn.ai-off { color: var(--muted); opacity: .48; }
  .iconbtn.ai-off:hover { background: var(--surface-h); }
  .iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Barre d'adresse */
  .address {
    position: relative;
    flex: 1; display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 6px 0 14px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 21px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .address.focus {
    border-color: transparent;
    box-shadow: 0 1px 8px rgba(26,115,232,.35);
  }

  /* Le mode recherche IA vit uniquement sur la barre centrale de l'accueil :
     la barre d'adresse reste une barre classique (aucun halo ni bouton IA). */
  .iconbtn.ai-on { color: #1f7bff; }
  .iconbtn.ai-on svg { filter: drop-shadow(0 0 6px rgba(31,123,255,.75)); }
  body.dark .iconbtn.ai-on { color: #8ab4f8; }
  body.dark .iconbtn.ai-on svg { filter: drop-shadow(0 0 6px rgba(138,180,248,.75)); }
  .address .search {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex: none;
    color: var(--muted);
  }
  .address .search:hover { background: var(--surface-h); color: var(--accent); }
  .address .search svg { width: 16px; height: 16px; fill: currentColor; }
  .address .search { transition: background .12s ease, transform .22s cubic-bezier(.34,1.56,.64,1); }
  .address .search:active { transform: scale(.8); }
  .newtab { transition: background .12s ease, color .12s ease, transform .22s cubic-bezier(.34,1.56,.64,1); }
  .newtab:active { transform: scale(.8); }
  .bm { transition: background .12s ease, transform .18s cubic-bezier(.34,1.56,.64,1); }
  .bm:active { transform: scale(.94); }
  .address input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--text);
    user-select: text; -webkit-user-select: text;
  }
  .address input::placeholder { color: var(--muted); }
  .star { color: var(--muted); }
  .star.on { color: #f5b400; }
  .star.on svg { fill: #f5b400; stroke: #f5b400; }
  #media.active { background: var(--surface-h); color: var(--accent); }

  /* Toujours present mais replie : il glisse a l'ouverture du mode local. */
  .lock { display: flex; align-items: center; gap: 6px; height: 30px;
          border-radius: 15px; background: rgba(217,48,37,.14); color: var(--danger);
          font-size: 12px; font-weight: 600; flex: none; overflow: hidden; white-space: nowrap;
          max-width: 0; padding: 0; margin: 0; opacity: 0;
          transition: max-width .28s cubic-bezier(.34,1.4,.64,1), padding .28s ease,
                      margin .28s ease, opacity .2s ease; }
  body.offline .lock { max-width: 140px; padding: 0 12px; margin: 0 2px 0 4px; opacity: 1; }
  .lock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }

  /* ---------- Barre de progression (facon Google) ---------- */
  /* Remplace le trait separateur habituel : transparente au repos, elle se
     remplit de gauche a droite pendant le chargement d'une page/recherche. */
  .loadbar { height: 3px; background: var(--bar); overflow: hidden; flex: none; }
  .loadbar-fill {
    height: 100%; width: 0%; opacity: 0;
    background: linear-gradient(90deg, #4898ff, #00d4ff);
  }
  .loadbar-fill.animating { transition: width .2s ease, opacity .3s ease; }
  .loadbar-fill.active { opacity: 1; }

  /* ---------- Barre de favoris ---------- */
  .bookmarks-bar {
    display: flex; align-items: center; gap: 6px;
    /* Une vraie zone respirante, avec les icones et le profil centres entre
       les deux limites de la barre. */
    height: var(--bookmarks-bar-height); padding: 14px 24px 15px;
    background: var(--bar);
    border-top: 1px solid var(--border);
  }
  /* Cette zone appartient uniquement à l'accueil. Les pages web gardent une
     chrome compacte : aucun favori, profil ou lanceur ne doit y rester. */
  .bookmarks-bar { display: none; }
  body.home-context .bookmarks-bar { display: flex; }
  .bookmarks {
    display: flex; align-items: center; gap: 4px;
    flex: 1; min-width: 0; overflow: hidden; height: 100%;
  }
  .bookmark-folder-btn {
    height: 28px; min-width: 104px; padding: 0 10px 0 9px; border-radius: 8px; flex: none;
    display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 12.5px;
    transition: background .12s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .bookmark-folder-btn:hover,
  body.bookmarks-open .bookmark-folder-btn { background: var(--surface-h); }
  .bookmark-folder-btn:active { transform: scale(.94); }
  .bookmark-folder-btn svg {
    width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; flex: none;
  }
  .bookmark-folder-btn .count { color: var(--muted); font-size: 11.5px; margin-left: auto; }
  .bookmarks-pop {
    position: absolute; top: calc(95px + var(--bookmarks-bar-height)); left: 24px; width: 340px; max-width: calc(100vw - 48px);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 8px; z-index: 60;
    box-shadow: 0 10px 34px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none;
    transform: translateY(-6px) scale(.98); transform-origin: top left;
    transition: opacity .16s cubic-bezier(.2,.8,.2,1), transform .16s cubic-bezier(.2,.8,.2,1);
  }
  body.bookmarks-open .bookmarks-pop { opacity: 1; pointer-events: auto; transform: none; }
  .bp-list {
    max-height: 320px; overflow-y: auto; overflow-x: hidden;
    padding: 2px; scrollbar-width: thin;
  }
  .bp-row {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 8px; border-radius: 8px;
    font-size: 13px; color: var(--text); cursor: default;
    transition: background .1s ease;
  }
  .bp-row:hover { background: var(--surface-h); }
  .bp-row .favicon { width: 16px; height: 16px; border-radius: 4px; flex: none; position: relative; overflow: hidden; }
  .bp-row .favicon.fallback { background: linear-gradient(90deg, #4898ff, #00ffff); }
  .bp-row .favicon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bp-row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bp-empty { color: var(--muted); font-size: 12.5px; padding: 14px 10px; text-align: center; }

  /* ---------- Profil (rond a droite de la barre de favoris) ---------- */
  .profile-chip {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; overflow: hidden;
    background: #9aa0a6;
    transition: box-shadow .15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .profile-chip:hover { box-shadow: 0 0 0 3px var(--surface-h); }
  .profile-chip:active { transform: scale(.9); }
  .profile-chip img { width: 100%; height: 100%; object-fit: cover; }

  .profile-pop {
    position: absolute; top: calc(95px + var(--bookmarks-bar-height)); right: 24px; width: 320px;
    max-width: calc(100vw - 48px);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 18px;
    padding: 14px 16px 16px; z-index: 60;
    box-shadow: 0 10px 34px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none;
    transform: translateY(-6px) scale(.98); transform-origin: top right;
    transition: opacity .16s cubic-bezier(.2,.8,.2,1), transform .16s cubic-bezier(.2,.8,.2,1);
  }
  body.profile-open .profile-pop { opacity: 1; pointer-events: auto; transform: none; }
  .pp-head { display: flex; align-items: center; margin-bottom: 6px; }
  .pp-head .pp-mail {
    flex: 1; text-align: center; font-size: 13px; color: var(--muted);
    padding-left: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pp-close {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px;
  }
  .pp-close:hover { background: var(--surface-h); color: var(--text); }
  .pp-avatar-wrap { position: relative; width: 80px; margin: 12px auto 16px; }
  .pp-avatar {
    width: 80px; height: 80px; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 600; color: #fff; background: #9aa0a6;
  }
  .pp-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pp-cam {
    position: absolute; right: -3px; bottom: -3px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--surface-h);
    border: 2px solid var(--surface);
    display: flex; align-items: center; justify-content: center; color: var(--text);
  }
  .pp-cam:hover { background: var(--border); }
  .pp-cam svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pp-hello {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 20px; font-weight: 500; text-align: center;
    white-space: nowrap; overflow: hidden;
  }
  .pp-hello .nm { overflow: hidden; text-overflow: ellipsis; }
  .pp-sub { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 7px; }
  .pp-edit {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  .pp-edit:hover { background: var(--surface-h); color: var(--text); }
  .pp-edit svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .pp-name-input {
    display: block; margin: 4px auto 0; width: 210px; text-align: center;
    font-size: 15px; padding: 7px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
    outline: none; font-family: inherit;
  }
  .pp-name-input:focus { border-color: var(--accent); }
  .pp-colors { display: flex; justify-content: center; gap: 14px; margin: 20px 0 8px; }
  .pp-dot {
    width: 22px; height: 22px; border-radius: 50%;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .pp-dot:hover { transform: scale(1.15); }
  .pp-dot.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .pp-primary {
    display: block; margin: 18px auto 0; width: fit-content;
    padding: 9px 22px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--accent); font-size: 13.5px; font-weight: 500; text-align: center;
  }
  .pp-primary:hover { background: var(--surface-h); }
  .pp-actions { display: flex; gap: 2px; margin-top: 18px; border-radius: 14px; overflow: hidden; }
  .pp-action {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 8px; background: var(--surface-h); font-size: 13px;
  }
  .pp-action:hover { background: var(--border); }
  .pp-action svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .pp-list { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; max-height: 150px; overflow: auto; }
  .pp-list-title { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin: 2px 6px 8px; }
  .pp-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; font-size: 13.5px; }
  .pp-row:hover { background: var(--surface-h); }
  .pp-row .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pp-row .mini {
    width: 24px; height: 24px; border-radius: 50%; flex: none; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700; background: #9aa0a6;
  }
  .pp-row .mini img { width: 100%; height: 100%; object-fit: cover; }
  .pp-row .del {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    display: none; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
  .pp-row:hover .del { display: flex; }
  .pp-row .del:hover { background: var(--danger); color: #fff; }
  .pp-foot { margin-top: 14px; text-align: center; font-size: 11.5px; color: var(--muted); }
  .bm {
    display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 6px 0 10px;
    border-radius: 8px; font-size: 12px; color: var(--text);
    max-width: 180px;
  }
  .bm:hover { background: var(--surface-h); }
  .bm .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bm .x { width: 16px; height: 16px; border-radius: 50%; display: none;
           align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .bm:hover .x { display: flex; }
  .bm .x:hover { background: var(--danger); color: #fff; }
  .bm .favicon { width: 14px; height: 14px; border-radius: 4px; flex: none; position: relative; overflow: hidden; }
  .bm .favicon.fallback { background: linear-gradient(90deg, #4898ff, #00ffff); }
  .bm .favicon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .empty { font-size: 12px; color: var(--muted); padding-left: 4px; }

  /* ---------- Suggestions de saisie (facon Google) ---------- */
  /* Carte flottante sous la barre d'adresse. Positionnee en JS (enfant du
     body) pour rester alignee et non rognee ; la hauteur de la chrome est
     etendue tant qu'elle est ouverte (comme les popups media/profil). */
  .omni-suggest {
    position: absolute; z-index: 45;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.22);
    padding: 6px; overflow: hidden;
    opacity: 0; pointer-events: none;
    transform: translateY(-6px);
    transition: opacity .14s cubic-bezier(.2,.8,.2,1), transform .14s cubic-bezier(.2,.8,.2,1);
  }
  body.omni-suggest-open .omni-suggest { opacity: 1; pointer-events: auto; transform: none; }
  .si-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px; border-radius: 11px; font-size: 14px; color: var(--text);
    white-space: nowrap; overflow: hidden; cursor: default;
    transition: background .1s ease;
  }
  .si-item .si-ic { width: 16px; height: 16px; flex: none; color: var(--muted); display: flex; }
  .si-item .si-ic svg { width: 16px; height: 16px; fill: currentColor; }
  .si-item .si-tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .si-item .si-tx b { font-weight: 600; color: var(--text); }
  .si-item.sel { background: var(--surface-h); }

  /* ---------- Informations du site / cookies (facon Chrome) ---------- */
  .site-info-trigger {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    display: none; align-items: center; justify-content: center;
    color: var(--muted); cursor: default;
  }
  .site-info-trigger.show { display: flex; }
  .site-info-trigger:hover, .site-info-trigger.on { background: var(--surface-h); color: var(--text); }
  .site-info-trigger svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .site-info-pop {
    position: absolute; z-index: 58; width: 400px; max-width: calc(100vw - 24px);
    padding: 10px; border: 1px solid var(--border); border-radius: 18px;
    background: var(--surface); color: var(--text); box-shadow: 0 12px 34px rgba(0,0,0,.30);
    opacity: 0; pointer-events: none; transform: translateY(-6px) scale(.985);
    transform-origin: top left; transition: opacity .15s ease, transform .15s ease;
  }
  body.site-info-open .site-info-pop { opacity: 1; pointer-events: auto; transform: none; }
  .sip-head { display: flex; align-items: center; gap: 10px; padding: 8px 8px 10px; }
  .sip-host { flex: 1; min-width: 0; font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sip-close, .sip-back { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
  .sip-close:hover, .sip-back:hover { background: var(--surface-h); color: var(--text); }
  .sip-close svg, .sip-back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .sip-status { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 0 2px 6px; border-radius: 12px; background: rgba(26,115,232,.10); color: var(--text); }
  .sip-status.warn { background: rgba(217,48,37,.10); }
  .sip-status svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sip-status.warn svg { stroke: var(--danger); }
  .sip-status .t { font-size: 13.5px; font-weight: 600; }
  .sip-status .s { margin-top: 2px; color: var(--muted); font-size: 11.5px; }
  .sip-row { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 10px; border-radius: 12px; cursor: default; }
  .sip-row:hover { background: var(--surface-h); }
  .sip-row .ic { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
  .sip-row .ic svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .sip-row .copy { flex: 1; min-width: 0; }
  .sip-row .t { font-size: 14px; font-weight: 600; }
  .sip-row .s { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sip-row .chev { color: var(--muted); font-size: 25px; line-height: 1; }
  .sip-divider { height: 1px; background: var(--border); margin: 6px 8px; }
  .sip-note { color: var(--muted); font-size: 12px; line-height: 1.42; padding: 8px 12px 11px; }
  .sip-cookie-list { max-height: 190px; overflow: auto; margin: 0 2px 8px; border: 1px solid var(--border); border-radius: 11px; }
  .sip-cookie { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .sip-cookie:last-child { border-bottom: 0; }
  .sip-cookie .n { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sip-cookie .m { margin-top: 2px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sip-empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 22px 10px; }
  .sip-danger { display: flex; align-items: center; justify-content: center; width: calc(100% - 8px); margin: 6px 4px 2px; min-height: 38px; border-radius: 999px; border: 1px solid var(--border); color: var(--danger); font: inherit; font-size: 13px; font-weight: 600; background: transparent; }
  .sip-danger:hover { background: rgba(217,48,37,.10); }

  /* ---------- Lanceur d'applications (facon Google) ---------- */
  /* Bouton : deux carres arrondis superposes, legerement en eventail. Le fond
     s'ouvre un peu plus au survol (animation douce). */
  .launcher-btn {
    width: 34px; height: 30px; border-radius: 9px; flex: none;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .launcher-btn:hover { background: var(--surface-h); }
  .launcher-btn:active { transform: scale(.9); }
  .lb-sq {
    position: absolute; width: 17px; height: 17px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s cubic-bezier(.34,1.4,.64,1);
  }
  .lb-back {
    background: var(--muted);
    transform: translate(-4px, 3px) rotate(-16deg);
  }
  .lb-front {
    background: linear-gradient(135deg, #4898ff, #00d4ff);
    transform: translate(3px, -2px) rotate(7deg);
    box-shadow: 0 1px 3px rgba(0,0,0,.22);
  }
  .lb-front svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .lb-back svg  { width: 11px; height: 11px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .launcher-btn:hover .lb-back  { transform: translate(-6px, 4px) rotate(-25deg); }
  .launcher-btn:hover .lb-front { transform: translate(4px, -3px) rotate(11deg); }

  /* Popup facon Google : grille d'apps arrondie. */
  .launcher-pop {
    position: absolute; top: calc(95px + var(--bookmarks-bar-height)); right: 24px; width: 340px;
    max-width: calc(100vw - 48px);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 14px 16px 16px; z-index: 60;
    box-shadow: 0 10px 34px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none;
    transform: translateY(-6px) scale(.98); transform-origin: top right;
    transition: opacity .16s cubic-bezier(.2,.8,.2,1), transform .16s cubic-bezier(.2,.8,.2,1);
  }
  body.launcher-open .launcher-pop { opacity: 1; pointer-events: auto; transform: none; }
  .lp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .lp-title { flex: 1; font-size: 17px; font-weight: 500; padding-left: 4px; }
  .lp-edit {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    transition: background .12s ease, color .12s ease;
  }
  .lp-edit:hover { background: var(--surface-h); color: var(--text); }
  body.launcher-edit .lp-edit { background: var(--surface-h); color: var(--accent); }
  .lp-edit svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .lp-modes {
    display: flex; gap: 8px; margin: 0; max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .22s ease, opacity .18s ease, margin .22s ease;
  }
  body.launcher-edit .lp-modes { max-height: 48px; opacity: 1; margin: 6px 2px 4px; }
  .lp-mode {
    flex: 1; text-align: center; padding: 8px 6px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--border); color: var(--muted); cursor: default;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .lp-mode:hover { background: var(--surface-h); }
  .lp-mode.sel { background: rgba(26,115,232,.14); border-color: transparent; color: var(--accent); }
  body.dark .lp-mode.sel { background: rgba(138,180,248,.18); }
  .lp-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    max-height: 348px; overflow-y: auto; overflow-x: hidden; padding: 8px 0 2px;
  }
  .lp-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 4px 10px; border-radius: 14px; position: relative; cursor: pointer;
    transition: background .12s ease;
  }
  .lp-tile:hover { background: var(--surface-h); }
  .lp-ic {
    width: 46px; height: 46px; border-radius: 50%; background: var(--input-bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.12);
    transition: box-shadow .12s ease;
  }
  .lp-tile:hover .lp-ic { box-shadow: 0 1px 6px rgba(0,0,0,.2); }
  .lp-ic .fallback { display: none; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(90deg, #4898ff, #00ffff); }
  .lp-ic .fallback.show { display: block; }
  .lp-ic img { position: relative; width: 26px; height: 26px; object-fit: contain; }
  .lp-label { font-size: 12px; text-align: center; max-width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lp-del {
    position: absolute; top: 2px; right: 12px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--surface); color: var(--muted); box-shadow: 0 1px 3px rgba(0,0,0,.22);
    display: none; align-items: center; justify-content: center; font-size: 13px; line-height: 1;
  }
  .lp-tile:hover .lp-del { display: flex; }
  .lp-del:hover { color: var(--danger); }
  .lp-add .lp-ic { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border); }
  .lp-add:hover .lp-ic { box-shadow: inset 0 0 0 1.5px var(--muted); }
  .lp-add .lp-ic svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .lp-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 12.5px; padding: 6px 8px 2px; }

  /* Mini-menu clic droit (supprimer un raccourci creatif). */
  .lp-menu {
    position: absolute; z-index: 90; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.3); padding: 4px; min-width: 160px;
    opacity: 0; pointer-events: none; transform: scale(.96); transform-origin: top left;
    transition: opacity .12s ease, transform .12s ease;
  }
  body.lp-menu-open .lp-menu { opacity: 1; pointer-events: auto; transform: none; }
  .lp-menu-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; color: var(--text); cursor: default; }
  .lp-menu-item:hover { background: var(--surface-h); }
  .lp-menu-item.danger:hover { color: var(--danger); }
  .lp-menu-item svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Mini-formulaire d'ajout INTEGRE au popup (pas de masque plein ecran) :
     il remplace la grille le temps de saisir le lien. */
  .lp-addform { padding: 10px 2px 2px; }
  .lp-af-title { font-size: 14px; font-weight: 500; margin: 2px 4px 12px; }
  .lp-addform input {
    width: 100%; box-sizing: border-box; padding: 11px 13px; font-size: 14px; font-family: inherit;
    color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 10px;
    outline: none; margin-bottom: 12px;
  }
  .lp-addform input:focus { border-color: var(--accent); }
  .lp-af-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }
  .lp-af-btn { padding: 8px 18px; border-radius: 999px; border: none; cursor: pointer; font-size: 13.5px; font-family: inherit; font-weight: 500; background: transparent; color: var(--accent); }
  .lp-af-btn:hover { background: rgba(26,115,232,.10); }
  .lp-af-btn.primary { background: var(--accent); color: #fff; }
  .lp-af-btn.primary:disabled { background: var(--border); color: var(--muted); cursor: default; }

  /* ---------- Telechargements ---------- */
  /* Le bouton n'existe qu'a partir du premier telechargement de la session,
     et prend la place de l'etoile favoris de Chrome (a droite de la barre). */
  .dl-btn { display: none; position: relative; }
  body.has-downloads .dl-btn { display: flex; }
  .dl-btn.active { background: var(--surface-h); }
  .dl-btn .dl-arrow { position: relative; z-index: 1; }
  /* Anneau de progression : visible uniquement pendant un telechargement. */
  .dl-btn .dl-ring { position: absolute; inset: 0; width: 34px; height: 34px; opacity: 0; transition: opacity .18s ease; }
  .dl-btn.busy .dl-ring { opacity: 1; }
  .dl-ring circle { fill: none; stroke-width: 2.2; }
  .dl-ring .bg   { stroke: var(--border); }
  .dl-ring .fill {
    stroke: var(--accent); stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 50% 50%;
    transition: stroke-dashoffset .2s cubic-bezier(.2,.8,.2,1);
  }
  body.dark .dl-ring .fill { stroke: #8ab4f8; }
  /* Pastille de fin : une petite pulsation quand un fichier vient d'arriver. */
  @keyframes dl-done { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .dl-btn.done .dl-arrow { animation: dl-done .42s cubic-bezier(.34,1.56,.64,1); }

  .dl-pop {
    position: absolute; top: 94px; right: 10px; width: 380px; max-width: calc(100vw - 20px);
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 16px; padding: 8px; z-index: 50; overflow: hidden;
    opacity: 0; pointer-events: none;
    transform: translateY(-6px) scale(.99); transform-origin: top right;
    transition: opacity .16s cubic-bezier(.2,.8,.2,1), transform .16s cubic-bezier(.2,.8,.2,1);
  }
  body.downloads-open .dl-pop { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
  .dl-head { display: flex; align-items: center; gap: 10px; padding: 10px 6px 12px 12px; }
  .dl-head .t { flex: 1; font-size: 16px; font-weight: 600; }
  .dl-x {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    transition: background .12s ease, color .12s ease;
  }
  .dl-x:hover { background: var(--surface-h); color: var(--text); }
  .dl-x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  .dl-list { max-height: 320px; overflow-y: auto; }
  .dl-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px 10px 12px; border-radius: 12px;
    transition: background .12s ease;
  }
  .dl-item:hover { background: var(--surface-h); }
  .dl-fav { width: 32px; height: 32px; flex: none; position: relative; }
  .dl-fav img { width: 32px; height: 32px; object-fit: contain; display: block; }
  .dl-fav .generic { width: 32px; height: 32px; color: var(--muted); stroke: currentColor; fill: none; stroke-width: 1.6; }
  /* Cercle de progression d'une ligne : survol -> croix d'annulation. */
  .dl-prog { width: 32px; height: 32px; display: block; }
  .dl-prog circle { fill: none; stroke-width: 2.4; }
  .dl-prog .bg { stroke: var(--border); }
  .dl-prog .fill {
    stroke: var(--accent); stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 50% 50%;
    transition: stroke-dashoffset .25s cubic-bezier(.2,.8,.2,1);
  }
  body.dark .dl-prog .fill { stroke: #8ab4f8; }
  .dl-cancel {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s ease; color: var(--text);
  }
  .dl-cancel svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .dl-fav.cancellable:hover .dl-prog { opacity: .25; }
  .dl-fav.cancellable:hover .dl-cancel { opacity: 1; }

  .dl-meta { flex: 1; min-width: 0; }
  .dl-name {
    font-size: 14px; font-weight: 600; line-height: 1.35;
    overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    word-break: break-all;
  }
  .dl-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dl-item.cancelled .dl-name { color: var(--muted); text-decoration: line-through; }
  .dl-act {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    transition: background .12s ease, color .12s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  .dl-act:hover { background: rgba(128,128,128,.20); color: var(--text); }
  .dl-act:active { transform: scale(.86); }
  .dl-act.off { opacity: .3; pointer-events: none; }
  .dl-act svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dl-empty { padding: 22px 10px 26px; color: var(--muted); text-align: center; font-size: 13px; }
  .dl-foot {
    display: flex; align-items: center; gap: 10px;
    margin-top: 4px; padding: 12px; border-radius: 12px;
    border-top: 1px solid var(--border); font-size: 14px; font-weight: 600;
    transition: background .12s ease;
  }
  .dl-foot:hover { background: var(--surface-h); }
  .dl-foot .t { flex: 1; }

  /* ---------- Controle media ---------- */
  .media-pop {
    position: absolute; top: 94px; right: 10px; width: 420px; max-width: calc(100vw - 20px);
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: none; padding: 14px;
    z-index: 50; display: block; overflow: hidden; opacity: 0; pointer-events: none;
    transform: translateY(-6px) scale(.99); transform-origin: top right;
    transition: opacity .16s cubic-bezier(.2,.8,.2,1), transform .16s cubic-bezier(.2,.8,.2,1);
  }
  body.media-open .media-pop { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
  .media-card {
    display: grid; grid-template-columns: 82px minmax(0, 1fr) 64px; gap: 12px; align-items: center;
    background: var(--surface-h); border-radius: 14px; padding: 12px;
  }
  .media-art { width:82px; height:82px; border-radius:10px; background:var(--bg); object-fit:cover; }
  .media-info { min-width:0; overflow:hidden; }
  .media-title { display:block; max-width:100%; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .media-sub { color:var(--muted); font-size:13px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .media-play {
    width:58px; height:58px; border-radius:50%; border:none; background:#77d8e8; color:#07333b;
    display:flex; align-items:center; justify-content:center;
  }
  .media-play svg { width:28px; height:28px; fill:currentColor; stroke:none; }
  .media-controls { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .media-small {
    width:32px; height:32px; border:none; border-radius:50%; background:transparent; color:var(--muted);
    display:flex; align-items:center; justify-content:center;
  }
  .media-small:hover { background:rgba(128,128,128,.18); color:var(--text); }
  .media-small svg { width:19px; height:19px; }
  .media-bar { flex:1; height:5px; border-radius:999px; background:rgba(128,128,128,.22); overflow:hidden; }
  .media-fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#4898ff,#00d4ff); }
  .media-row {
    display:flex; align-items:center; gap:12px; min-height:46px; padding:10px 4px 0;
    border-top:1px solid var(--border); margin-top:12px; font-size:14px;
  }
  .media-row:first-of-type { border-top:none; }
  .media-row .grow { flex:1; }
  .media-toggle { width:40px; height:22px; border-radius:11px; background:rgba(128,128,128,.28); position:relative; }
  .media-toggle::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; }
  .media-toggle.on { background:#77d8e8; }
  .media-toggle.on::after { left:21px; }
  .media-empty { padding:22px 10px; color:var(--muted); text-align:center; }

  /* ----- Onglets epingles (compacts, favicon seule) ----- */
  .tab.pinned { max-width: 44px; min-width: 44px; padding: 0 0; justify-content: center; }
  .tab.pinned .title { display: none; }
  .tab.pinned .close { display: none; }
  .tab.pinned .tab-fav { margin: 0; }

  /* ----- Badge navigation privee sur l'onglet ----- */
  .tab .inpriv { width: 13px; height: 13px; flex: none; margin-left: 2px; color: var(--muted); display: none; }
  .tab.incognito .inpriv { display: block; }
  .tab.incognito .tab-fav { opacity: .85; }

  /* ----- Teinte "navigation privee" : un seul degrade continu sur toute la
     hauteur du chrome (aucune coupure entre barre d'onglets / outils / favoris). */
  body.incognito {
    --text: #ece9f8; --muted: #b7b0d6; --border: #39344f;
    --surface: #322c49; --surface-h: #3d3658; --active: #423a60;
    background: linear-gradient(180deg, #2c2842 0%, #262138 52%, #1e1a30 100%);
  }
  body.incognito .tabstrip,
  body.incognito .toolbar,
  body.incognito .bookmarks-bar,
  body.incognito .loadbar { background: transparent; }
  body.incognito .tabstrip-sep { background: rgba(255,255,255,.12); }
  .incognito-badge {
    display: none; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    margin: 0 0 4px 6px; border-radius: 13px; font-size: 11.5px; font-weight: 600;
    color: #cdbcff; background: rgba(150,120,255,.16); border: 1px solid rgba(150,120,255,.3); flex: none;
  }
  body.incognito .incognito-badge { display: inline-flex; }
  .incognito-badge svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }

  /* ----- Overlay de recherche d'onglets (ouvert au clavier ⌘⇧A) ----- */
  .tabsearch-pop {
    position: absolute; top: 42px; left: 50%; transform: translate(-50%, -8px);
    width: 460px; max-width: 82vw; background: var(--menu, var(--surface)); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 16px 44px rgba(0,0,0,.32);
    padding: 8px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease;
  }
  body.tabsearch-open .tabsearch-pop { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .tabsearch-pop input {
    width: 100%; border: none; outline: none; background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 13.5px; margin-bottom: 6px;
  }
  .ts-list { max-height: 320px; overflow-y: auto; }
  .ts-row { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 9px; cursor: default; }
  .ts-row:hover, .ts-row.sel { background: var(--surface-h); }
  .ts-row .favicon { width: 16px; height: 16px; border-radius: 4px; flex: none; position: relative; overflow: hidden; }
  .ts-row .m { flex: 1; min-width: 0; }
  .ts-row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .ts-row .u { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--muted); }
  .ts-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* ----- Toast (traduction, notifications legeres) ----- */
  .toast {
    position: absolute; top: 44px; left: 50%; transform: translate(-50%, -6px);
    background: linear-gradient(135deg, #4898ff, #00d4ff); color: #fff;
    padding: 8px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(72,152,255,.4); z-index: 70;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<script>
  const wv = window.zaalisBridge;
  const SEP = "\x1f";
  function post(...parts){ if (wv) wv.postMessage(parts.join(SEP)); }

  const $ = id => document.getElementById(id);
  const tabsEl = $("tabs"), omni = $("omni"), addr = $("address");
  let state = { theme:"light", searchEngine:"google", showBookmarks:true, tabs:[], active:{}, bookmarks:[] };
  let editing = false;
  let mediaOpen = false;
  let bookmarksOpen = false;
  let mediaState = { available:false };
  let mediaPoll = 0;
  let siteInfoOpen = false;
  let siteInfoView = "summary";
  let siteInfo = { available:false, cookies:[], permissions:[] };

  function isInternal(u){ return !u || u.indexOf("zaalis.home") !== -1 || u.indexOf("zaalis://") === 0 || u === "about:blank"; }
  function isHome(u){ return u === "zaalis://home/index.html" || u === "zaalis://home/"; }

  const SIP_LOCK = '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  const SIP_WARN = '<svg viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>';
  const SIP_COOKIE = '<svg viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a4.4 4.4 0 0 0 9.7 9.7z"/><circle cx="8.4" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="11.7" cy="16.2" r="1" fill="currentColor" stroke="none"/><circle cx="15.8" cy="11.1" r="1" fill="currentColor" stroke="none"/></svg>';
  const SIP_GEAR = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

  function positionSiteInfo(){
    const r = addr.getBoundingClientRect();
    const pop = $("site-info-pop");
    pop.style.left = Math.max(12, Math.min(r.left, window.innerWidth - 412)) + "px";
    pop.style.top = (r.bottom + 6) + "px";
  }
  function closeSiteInfo(){
    siteInfoOpen = false;
    document.body.classList.remove("site-info-open");
    $("site-info-trigger").classList.remove("on");
    reportHeight();
  }
  function setSiteInfoOpen(open){
    if (open && isInternal(state.active.url || "")) return;
    siteInfoOpen = !!open;
    document.body.classList.toggle("site-info-open", siteInfoOpen);
    $("site-info-trigger").classList.toggle("on", siteInfoOpen);
    if (siteInfoOpen) {
      siteInfoView = "summary";
      siteInfo = { available:false, cookies:[], permissions:[] };
      if (bookmarksOpen) setBookmarksOpen(false);
      if (profileOpen) setProfileOpen(false);
      if (mediaOpen) setMediaOpen(false);
      if (dlOpen) setDownloadsOpen(false);
      if (launcherOpen) setLauncherOpen(false);
      positionSiteInfo(); renderSiteInfo(); post("getSiteInfo");
    }
    reportHeight();
  }
  function sipHeader(title, back){
    return '<div class="sip-head">' + (back ? '<div class="sip-back" id="sip-back" title="Retour"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></div>' : '') +
      '<div class="sip-host">' + escHtml(title || "Informations sur le site") + '</div><div class="sip-close" id="sip-close" title="Fermer"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></div></div>';
  }
  function sipRow(icon, title, subtitle, id){
    return '<div class="sip-row"' + (id ? ' id="' + id + '"' : '') + '><div class="ic">' + icon + '</div><div class="copy"><div class="t">' + escHtml(title) + '</div><div class="s">' + escHtml(subtitle || "") + '</div></div>' + (id ? '<div class="chev">›</div>' : '') + '</div>';
  }
  function wireSiteInfoHeader(){
    const close = $("sip-close"); if (close) close.onclick = closeSiteInfo;
    const back = $("sip-back"); if (back) back.onclick = () => { siteInfoView = "summary"; renderSiteInfo(); reportHeight(); };
  }
  function renderSiteInfo(){
    const pop = $("site-info-pop");
    if (!siteInfoOpen) return;
    const info = siteInfo || {};
    const host = info.host || (() => { try { return new URL(state.active.url || "").hostname; } catch { return ""; } })();
    if (siteInfoView === "cookies") {
      const cookies = Array.isArray(info.cookies) ? info.cookies : [];
      let html = sipHeader("Cookies et données des sites", true);
      html += '<div class="sip-note">' + (cookies.length ? cookies.length + ' cookie' + (cookies.length > 1 ? 's sont enregistrés pour ce site.' : ' est enregistré pour ce site.') : 'Aucun cookie enregistré pour ce site.') + '</div>';
      html += cookies.length ? '<div class="sip-cookie-list">' + cookies.map(c => '<div class="sip-cookie"><div class="n">' + escHtml(c.name || "(sans nom)") + '</div><div class="m">' + escHtml(c.domain + ' · ' + (c.session ? 'session' : 'persistant') + (c.secure ? ' · sécurisé' : '')) + '</div></div>').join("") + '</div>' : '<div class="sip-empty">Aucun cookie à afficher.</div>';
      html += '<button class="sip-danger" id="sip-clear-data">Effacer les cookies et les données du site</button>';
      pop.innerHTML = html; wireSiteInfoHeader();
      $("sip-clear-data").onclick = () => { if (confirm("Effacer les cookies et les données de " + host + " ? Vous pourrez être déconnecté.")) post("clearSiteData"); };
    } else if (siteInfoView === "settings") {
      const permissions = Array.isArray(info.permissions) ? info.permissions : [];
      let html = sipHeader("Paramètres du site", true);
      html += '<div class="sip-note">Autorisations accordées ou bloquées pour <b>' + escHtml(host) + '</b>.</div>';
      html += permissions.length ? '<div class="sip-cookie-list">' + permissions.map(p => '<div class="sip-cookie"><div class="n">' + escHtml(p.permission) + '</div><div class="m">' + (p.value === 'allow' ? 'Autorisé' : 'Bloqué') + '</div></div>').join("") + '</div>' : '<div class="sip-empty">Aucune autorisation spécifique pour ce site.</div>';
      html += '<button class="sip-danger" id="sip-reset-perms">Réinitialiser les autorisations</button>';
      pop.innerHTML = html; wireSiteInfoHeader();
      $("sip-reset-perms").onclick = () => post("resetSitePermissions");
    } else {
      const cookieCount = Array.isArray(info.cookies) ? info.cookies.length : 0;
      const secure = info.available ? !!info.secure : /^https:\/\//i.test(state.active.url || "");
      let html = sipHeader(host || "Informations sur le site", false);
      html += '<div class="sip-status' + (secure ? '' : ' warn') + '">' + (secure ? SIP_LOCK : SIP_WARN) + '<div><div class="t">' + (secure ? 'La connexion est sécurisée' : 'La connexion n’est pas sécurisée') + '</div><div class="s">' + (secure ? 'Les données sont chiffrées pendant leur transfert.' : 'Évitez de saisir des informations sensibles.') + '</div></div></div>';
      html += sipRow(SIP_COOKIE, 'Cookies et données des sites', cookieCount ? cookieCount + ' cookie' + (cookieCount > 1 ? 's' : '') : 'Aucun cookie', 'sip-cookies');
      html += '<div class="sip-divider"></div>';
      html += sipRow(SIP_GEAR, 'Paramètres des sites', 'Autorisations et accès du site', 'sip-settings');
      html += '<div class="sip-note">Les cookies restent séparés pour chaque profil' + (info.incognito ? ' et sont supprimés à la fermeture de la navigation privée.' : '.') + '</div>';
      pop.innerHTML = html; wireSiteInfoHeader();
      $("sip-cookies").onclick = () => { siteInfoView = "cookies"; renderSiteInfo(); reportHeight(); };
      $("sip-settings").onclick = () => { siteInfoView = "settings"; renderSiteInfo(); reportHeight(); };
    }
  }

  // Le mode IA vit uniquement sur la barre centrale de l'accueil : la barre
  // d'adresse est une barre de navigation classique.
  function updatePlaceholder(){
    const engineNames = { google:"Google", bing:"Bing", duckduckgo:"DuckDuckGo", brave:"Brave" };
    omni.placeholder = "Rechercher avec " + (engineNames[state.searchEngine] || "Google") + " ou saisir une URL";
  }

  function faviconUrl(u) {
    try { return "https://www.google.com/s2/favicons?sz=64&format=png&domain=" + encodeURIComponent(new URL(u).hostname); }
    catch (e) { return ""; }
  }
  function faviconNode(className, url) {
    const fav = document.createElement("div"); fav.className = className || "favicon";
    const src = faviconUrl(url);
    if (src && !isInternal(url)) {
      const img = document.createElement("img"); img.alt = ""; img.decoding = "async";
      img.onerror = () => { img.remove(); fav.classList.add("fallback"); };
      img.src = src;
      fav.appendChild(img);
    } else {
      fav.classList.add("fallback");
    }
    return fav;
  }

  // Le "+" suit le dernier onglet : quand un onglet s'ouvre ou se ferme, on le
  // fait glisser depuis son ancienne position (FLIP) au lieu de le teleporter.
  const plusGroup = () => [document.querySelector(".tabstrip-sep"), $("newtab")];
  const plusLeft = () => $("newtab").getBoundingClientRect().left;
  let plusReady = false;
  function slidePlus(before){
    if (!plusReady) { plusReady = true; return; }   // pas d'animation au 1er rendu
    const delta = before - plusLeft();
    if (!isFinite(delta) || Math.abs(delta) < 1) return;
    plusGroup().forEach(el => el.animate(
      [{ transform: `translateX(${delta}px)` }, { transform: "none" }],
      { duration: 220, easing: "cubic-bezier(.2,.8,.2,1)" }
    ));
  }

  function render(){
    document.body.classList.toggle("dark", state.theme === "dark");
    document.body.classList.toggle("incognito", !!state.incognito);
    document.body.classList.toggle("hide-bookmarks", state.showBookmarks === false);
    const homeContext = isHome(state.active.url || "");
    document.body.classList.toggle("home-context", homeContext);
    if (!homeContext) closeHomeContext();
    const webSite = /^https?:\/\//i.test(state.active.url || "");
    $("site-info-trigger").classList.toggle("show", webSite);
    if (!webSite && siteInfoOpen) closeSiteInfo();
    if (siteInfoOpen) { positionSiteInfo(); renderSiteInfo(); }
    updatePlaceholder();

    // Onglets
    const plusBefore = plusLeft();
    tabsEl.innerHTML = "";
    state.tabs.forEach(t => {
      const el = document.createElement("div");
      const inSplit = Array.isArray(state.split) && state.split.indexOf(t.id) !== -1;
      const splitSide = inSplit ? (state.split[0] === t.id ? " split-l" : " split-r") : "";
      el.className = "tab" + (t.active ? " active" : "") + (inSplit ? " split" + splitSide : "")
        + (t.pinned ? " pinned" : "") + (t.incognito ? " incognito" : "");
      el.dataset.id = t.id;
      el.addEventListener("contextmenu", (e) => {
        e.preventDefault(); e.stopPropagation();
        // Le menu natif avale le pointerup : tout drag en cours doit etre
        // annule ici, sinon l'onglet reste accroche au curseur apres le menu.
        cancelTabDrag();
        // Verrouille l'apparence : pas de fond :hover tant que le pointeur
        // n'a pas quitté puis re-survolé la tab (macOS + Menu.popup).
        el.classList.add("suppress-hover");
        const clear = () => { el.classList.remove("suppress-hover");
          el.removeEventListener("pointerleave", clear);
          el.removeEventListener("pointermove", onMove); };
        const onMove = (ev) => { const b = el.getBoundingClientRect();
          if (ev.clientX < b.left || ev.clientX > b.right || ev.clientY < b.top || ev.clientY > b.bottom) clear(); };
        el.addEventListener("pointerleave", clear);
        el.addEventListener("pointermove", onMove);
        post("tabMenu", t.id);
      });
      el.appendChild(faviconNode("tab-fav", t.url));
      el.title = t.title && t.title.trim() ? t.title : (t.incognito ? "Onglet privé" : "Nouvel onglet");
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = t.title && t.title.trim() ? t.title : (t.incognito ? "Onglet privé" : "Nouvel onglet");
      el.appendChild(title);
      if (t.incognito) {
        const priv = document.createElement("span");
        priv.className = "inpriv";
        priv.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7.5" cy="15" r="3"/><circle cx="16.5" cy="15" r="3"/><path d="M10.5 15h3"/><path d="M4 12l2-5h12l2 5"/></svg>';
        el.appendChild(priv);
      }
      const close = document.createElement("div");
      close.className = "close"; close.textContent = "x";
      close.onclick = (e)=>{ e.stopPropagation(); post("closeTab", t.id); };
      el.appendChild(close);
      el.addEventListener("pointerdown", (e)=> startTabDrag(e, el, t.id));
      tabsEl.appendChild(el);
    });
    slidePlus(plusBefore);

    // Barre d'adresse (sauf si l'utilisateur tape)
    if (!editing) {
      const u = state.active.url || "";
      omni.value = isInternal(u) ? "" : u;
    }

    document.body.classList.toggle("offline", !!state.offline);

    // Boutons nav
    $("back").classList.toggle("disabled", !state.active.canBack);
    $("forward").classList.toggle("disabled", !state.active.canForward);
    $("star").classList.toggle("on", !!state.active.isBookmarked);
    $("star").title = state.active.isBookmarked ? "Retirer des favoris" : "Ajouter aux favoris";
    $("media").classList.toggle("active", mediaOpen);

    // Grise le chat IA si l'IDE n'est pas joignable.
    const aiOff = !state.aiConnected;
    $("aichat").classList.toggle("ai-off", aiOff);
    $("aichat").title = aiOff
      ? (state.aiStatusMessage || "IA indisponible : zaalis labs ide non joignable.")
      : "Chat IA — zaalis labs ide";

    // Meme bleu que la recherche IA quand le panneau correspondant est ouvert.
    $("aichat").classList.toggle("ai-on", !!state.aiPanelOpen && !aiOff);
    $("settings").classList.toggle("ai-on", !!state.panelOpen);

    // Favoris : le bouton dossier reste seul sur la barre, le detail vit dans
    // la mini-fenetre scrollable pour garder une largeur Chrome-like stable.
    $("bookmarks-count").textContent = String(state.bookmarks.length || 0);
    const bm = $("bookmarks"); bm.innerHTML = "";
    if (bookmarksOpen) renderBookmarksPop();

    // Profil : rond de la barre de favoris + popup s'il est ouvert.
    renderProfileChip();
    if (profileOpen && !profileEditingName && !profileCreating) renderProfilePop();
    if (typeof launcherOpen !== "undefined" && launcherOpen && !launcherAdding) renderLauncher();

    // Barre de progression : demarre/arrete au changement d'etat de chargement.
    const loading = !!state.active.loading;
    if (loading !== wasLoading) { wasLoading = loading; setLoadingBar(loading); }

    reportHeight();
  }

  // Barre de progression "facon Google" : progression indeterminee (on ne
  // connait pas la duree du chargement a l'avance), qui ralentit en
  // s'approchant de 90% puis se termine d'un trait quand la page est prete.
  let loadTimer = 0;
  let loadPct = 0;
  let wasLoading = false;
  function setLoadingBar(active){
    const fill = $("loadbar-fill");
    clearInterval(loadTimer); loadTimer = 0;
    if (active) {
      loadPct = 0;
      fill.classList.remove("animating");
      fill.style.width = "0%";
      void fill.offsetWidth; // force reflow avant de reactiver la transition
      fill.classList.add("animating", "active");
      loadTimer = setInterval(() => {
        loadPct += (90 - loadPct) * 0.08;
        fill.style.width = Math.min(loadPct, 90) + "%";
      }, 120);
    } else {
      fill.classList.add("animating");
      fill.style.width = "100%";
      setTimeout(() => {
        fill.classList.remove("active");
        setTimeout(() => { fill.classList.remove("animating"); fill.style.width = "0%"; }, 300);
      }, 200);
    }
  }

  function fmtTime(seconds){
    seconds = Math.max(0, Math.floor(Number(seconds) || 0));
    const m = Math.floor(seconds / 60), s = seconds % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  // ----- Telechargements (facon Google) -----
  // Le bouton apparait au premier telechargement, affiche l'anneau de
  // progression, et la bulle s'ouvre toute seule quand un fichier demarre.
  let downloads = [];
  let dlOpen = false;
  const dlSeen = new Set();          // ids deja affiches -> detecte les nouveaux
  const dlPrevState = new Map();     // id -> etat precedent (pour l'animation de fin)
  let dlDoneTimer = 0;

  const RING_C = 2 * Math.PI * 14.6;   // anneau du bouton (r=14.6)
  const PROG_C = 2 * Math.PI * 13.8;   // cercle d'une ligne (r=13.8)

  function fmtSize(bytes){
    const b = Number(bytes) || 0;
    if (b < 1024) return b + " o";
    const u = ["Ko","Mo","Go","To"];
    let v = b / 1024, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v >= 10 ? Math.round(v) : Math.round(v * 10) / 10).toString().replace(".", ",") + " " + u[i];
  }

  function fmtAgo(ts){
    const s = Math.max(0, Math.round((Date.now() - (Number(ts) || 0)) / 1000));
    if (s < 60) return "A l'instant";
    const m = Math.round(s / 60);
    if (m < 60) return "Il y a " + m + " minute" + (m > 1 ? "s" : "");
    const h = Math.round(m / 60);
    if (h < 24) return "Il y a " + h + " heure" + (h > 1 ? "s" : "");
    const j = Math.round(h / 24);
    return "Il y a " + j + " jour" + (j > 1 ? "s" : "");
  }

  function dlSub(d){
    if (d.state === "progressing") {
      return d.total ? fmtSize(d.received) + " sur " + fmtSize(d.total)
                     : fmtSize(d.received) + " telecharges";
    }
    if (d.state === "cancelled")   return "Telechargement annule";
    if (d.state === "interrupted") return "Telechargement interrompu";
    return fmtSize(d.total || d.received) + " • " + fmtAgo(d.startedAt);
  }

  function svgEl(tag, attrs){
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Vignette de gauche : cercle de progression (annulable au survol) pendant le
  // telechargement, icone systeme du fichier une fois termine.
  function dlThumb(d){
    const fav = document.createElement("div");
    fav.className = "dl-fav";
    if (d.state === "progressing") {
      fav.classList.add("cancellable");
      fav.title = "Annuler le telechargement";
      const pct = d.total ? Math.max(0, Math.min(1, d.received / d.total)) : 0;
      const svg = svgEl("svg", { class: "dl-prog", viewBox: "0 0 32 32" });
      svg.appendChild(svgEl("circle", { class: "bg", cx: 16, cy: 16, r: 13.8 }));
      const fill = svgEl("circle", { class: "fill", cx: 16, cy: 16, r: 13.8 });
      fill.setAttribute("stroke-dasharray", PROG_C);
      // Sans taille connue, on montre un anneau au quart : progression inconnue.
      fill.setAttribute("stroke-dashoffset", d.total ? PROG_C * (1 - pct) : PROG_C * 0.75);
      svg.appendChild(fill);
      fav.appendChild(svg);
      const x = document.createElement("div");
      x.className = "dl-cancel";
      x.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      fav.appendChild(x);
      fav.onclick = (e) => { e.stopPropagation(); post("cancelDownload", d.id); };
      return fav;
    }
    if (d.icon) {
      const img = document.createElement("img");
      img.alt = ""; img.src = d.icon;
      fav.appendChild(img);
    } else {
      fav.innerHTML = '<svg class="generic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
    }
    return fav;
  }

  function dlAction(title, svg, enabled, fn){
    const b = document.createElement("div");
    b.className = "dl-act" + (enabled ? "" : " off");
    b.title = title;
    b.innerHTML = svg;
    if (enabled) b.onclick = (e) => { e.stopPropagation(); fn(); };
    return b;
  }

  const ICON_FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const ICON_OPEN   = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  function renderDownloadsList(){
    const list = $("dl-list");
    list.innerHTML = "";
    if (!downloads.length) {
      const e = document.createElement("div");
      e.className = "dl-empty";
      e.textContent = "Aucun telechargement recent.";
      list.appendChild(e);
      return;
    }
    downloads.forEach(d => {
      const row = document.createElement("div");
      row.className = "dl-item" + (d.state === "cancelled" || d.state === "interrupted" ? " cancelled" : "");
      row.title = d.path || d.url || "";
      row.appendChild(dlThumb(d));

      const meta = document.createElement("div");
      meta.className = "dl-meta";
      const n = document.createElement("div"); n.className = "dl-name"; n.textContent = d.name;
      const s = document.createElement("div"); s.className = "dl-sub";  s.textContent = dlSub(d);
      meta.appendChild(n); meta.appendChild(s);
      row.appendChild(meta);

      const done = d.state === "completed";
      // La "loupe" facon Finder : revele le fichier dans le gestionnaire.
      row.appendChild(dlAction("Afficher dans le Finder", ICON_FOLDER, done, () => post("showDownload", d.id)));
      row.appendChild(dlAction("Ouvrir le fichier",       ICON_OPEN,   done, () => post("openDownload", d.id)));
      if (done) row.ondblclick = () => post("openDownload", d.id);
      list.appendChild(row);
    });
  }

  function renderDownloads(){
    document.body.classList.toggle("has-downloads", downloads.length > 0);

    const busy = downloads.find(d => d.state === "progressing") || null;
    const btn  = $("downloads");
    btn.classList.toggle("busy", !!busy);
    if (busy) {
      const pct = busy.total ? Math.max(0, Math.min(1, busy.received / busy.total)) : 0;
      const fill = btn.querySelector(".dl-ring .fill");
      fill.setAttribute("stroke-dasharray", RING_C);
      fill.setAttribute("stroke-dashoffset", busy.total ? RING_C * (1 - pct) : RING_C * 0.75);
      btn.title = "Telechargement en cours — " + dlSub(busy);
    } else {
      btn.title = "Telechargements";
    }

    // Un fichier vient d'arriver : petite pulsation sur la fleche.
    let justDone = false;
    downloads.forEach(d => {
      if (dlPrevState.get(d.id) === "progressing" && d.state === "completed") justDone = true;
      dlPrevState.set(d.id, d.state);
    });
    if (justDone) {
      btn.classList.remove("done");
      void btn.offsetWidth;                       // relance l'animation
      btn.classList.add("done");
      clearTimeout(dlDoneTimer);
      dlDoneTimer = setTimeout(() => btn.classList.remove("done"), 500);
    }

    // Nouveau telechargement -> la bulle s'ouvre, comme Chrome.
    const fresh = downloads.some(d => d.state === "progressing" && !dlSeen.has(d.id));
    downloads.forEach(d => dlSeen.add(d.id));
    if (fresh && !dlOpen)       setDownloadsOpen(true);
    else if (!downloads.length) setDownloadsOpen(false);
    else { if (dlOpen) renderDownloadsList(); reportHeight(); }
  }

  function setDownloadsOpen(open){
    dlOpen = open && downloads.length > 0;
    document.body.classList.toggle("downloads-open", dlOpen);
    $("downloads").classList.toggle("active", dlOpen);
    if (dlOpen) {
      if (bookmarksOpen) setBookmarksOpen(false);
      if (mediaOpen) setMediaOpen(false);
      if (profileOpen) setProfileOpen(false);
      if (typeof launcherOpen !== "undefined" && launcherOpen) setLauncherOpen(false);
      renderDownloadsList();
    }
    reportHeight();
  }

  $("downloads").onclick  = () => setDownloadsOpen(!dlOpen);
  $("dl-close").onclick   = () => setDownloadsOpen(false);
  $("dl-full").onclick    = () => { setDownloadsOpen(false); post("openDownloadsPanel"); };

  // ----- Profils (facon Google, mais 100% local) -----
  const PROFILE_COLORS = ["#4898ff","#00c4a7","#f5b400","#e8710a","#d93025","#a142f4","#24c1e0","#5f6368"];
  let profileOpen = false;
  let profileEditingName = false;
  let profileCreating = false;

  function profileState(){ return state.profile || { currentId: "", current: null, list: [] }; }

  // Rond avatar : photo si presente, sinon initiale sur fond colore ("I" gris
  // pour l'invite).
  function avatarNode(p, cls){
    const el = document.createElement("div");
    el.className = cls;
    if (p && p.photo) {
      const img = document.createElement("img"); img.alt = "";
      img.src = "zaalis://home/profile-avatar/" + p.id + "?v=" + p.photo;
      img.onerror = () => { img.remove(); el.textContent = initialOf(p); el.style.background = p.color || "#9aa0a6"; };
      el.appendChild(img);
    } else if (p) {
      el.textContent = initialOf(p);
      el.style.background = p.color || "#9aa0a6";
    } else {
      el.textContent = "I";
      el.style.background = "#9aa0a6";
    }
    return el;
  }
  function initialOf(p){ return ((p.name || "?").trim().charAt(0) || "?").toUpperCase(); }

  function renderProfileChip(){
    const btn = $("profile-btn");
    const ps = profileState();
    btn.innerHTML = "";
    btn.appendChild(avatarNode(ps.current, "chip-inner"));
    const inner = btn.firstChild;
    inner.style.width = "100%"; inner.style.height = "100%";
    inner.style.display = "flex"; inner.style.alignItems = "center"; inner.style.justifyContent = "center";
    inner.style.borderRadius = "50%"; inner.style.overflow = "hidden";
    btn.title = ps.current ? ps.current.name : "Invité — cliquer pour gérer les profils";
  }

  function ppIcon(svg){ const s = document.createElement("span"); s.innerHTML = svg; return s.firstChild; }

  function renderProfilePop(){
    const pop = $("profile-pop");
    const ps = profileState();
    const cur = ps.current;
    pop.innerHTML = "";

    // En-tete : nom / "Invité" + fermer
    const head = document.createElement("div"); head.className = "pp-head";
    const mail = document.createElement("div"); mail.className = "pp-mail";
    mail.textContent = cur ? cur.name : "Invité";
    head.appendChild(mail);
    const close = document.createElement("div"); close.className = "pp-close"; close.textContent = "✕";
    close.onclick = () => setProfileOpen(false);
    head.appendChild(close);
    pop.appendChild(head);

    // Grand avatar (+ badge photo pour un profil)
    const wrap = document.createElement("div"); wrap.className = "pp-avatar-wrap";
    wrap.appendChild(avatarNode(cur, "pp-avatar"));
    if (cur) {
      const cam = document.createElement("div"); cam.className = "pp-cam"; cam.title = "Changer la photo";
      cam.innerHTML = '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
      cam.onclick = () => post("profilePhoto", cur.id);
      wrap.appendChild(cam);
    }
    pop.appendChild(wrap);

    // Bonjour + edition du pseudo
    const hello = document.createElement("div"); hello.className = "pp-hello";
    const nm = document.createElement("span"); nm.className = "nm";
    nm.textContent = cur ? ("Bonjour " + cur.name + " !") : "Bonjour !";
    hello.appendChild(nm);
    if (cur && !profileEditingName) {
      const ed = document.createElement("div"); ed.className = "pp-edit"; ed.title = "Modifier le pseudo";
      ed.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';
      ed.onclick = () => { profileEditingName = true; renderProfilePop(); };
      hello.appendChild(ed);
    }
    pop.appendChild(hello);

    if (cur && profileEditingName) {
      const inp = document.createElement("input");
      inp.className = "pp-name-input"; inp.maxLength = 40; inp.value = cur.name;
      inp.placeholder = "Pseudo";
      const commit = () => {
        profileEditingName = false;
        const v = inp.value.trim();
        if (v && v !== cur.name) post("profileRename", cur.id, v);
        else renderProfilePop();
      };
      inp.onkeydown = (e) => {
        if (e.key === "Enter") commit();
        else if (e.key === "Escape") { profileEditingName = false; renderProfilePop(); }
      };
      inp.onblur = commit;
      pop.appendChild(inp);
      setTimeout(() => { inp.focus(); inp.select(); }, 0);

  // ----- Reordonnancement des onglets au pointeur (facon Chrome) -----
  // L'onglet attrape suit le curseur (net, pas de fantome) ; les autres
  // s'ecartent en glissant pour lui laisser la place.
  const GAP = 4;
  const EASE = "transform .18s cubic-bezier(.2,.7,.3,1)";
  let drag = null;
  const tabEls = () => [...tabsEl.querySelectorAll(".tab")];

  // Annule proprement un drag en cours (menu contextuel, perte de focus…) :
  // retire les ecouteurs et remet tous les onglets a leur place.
  function cancelTabDrag() {
    if (!drag) return;
    window.removeEventListener("pointermove", onTabMove);
    window.removeEventListener("pointerup", onTabUp);
    const d = drag; drag = null;
    d.el.classList.remove("dragging");
    tabEls().forEach(t => { t.style.transition = ""; t.style.transform = ""; });
  }
  window.addEventListener("blur", cancelTabDrag);

  function startTabDrag(e, el, id) {
    if (e.button !== 0 || e.ctrlKey) return;  // ctrl+clic = menu contextuel macOS
    if (e.target.closest(".close")) return;   // clic sur fermer
    const els = tabEls();
    const index = els.indexOf(el);
    if (index < 0) return;
    const rects = els.map(t => { const b = t.getBoundingClientRect(); return { left: b.left, width: b.width, center: b.left + b.width / 2 }; });
    drag = { el, id, index, startX: e.clientX, rects, w: el.offsetWidth + GAP, target: index, moved: false };
    window.addEventListener("pointermove", onTabMove);
    window.addEventListener("pointerup", onTabUp, { once: true });
  }

  function onTabMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.startX;
    if (!drag.moved) {
      if (Math.abs(dx) < 4) return;          // seuil : sinon c'est un clic
      drag.moved = true;
      drag.el.classList.add("dragging");
    }
    drag.el.style.transition = "none";        // l'onglet tenu suit instantanement
    drag.el.style.transform = "translateX(" + dx + "px)";

    // Regle "façon Chrome" : un voisin ne se decale que lorsque l'onglet tenu
    // recouvre la MOITIE de sa largeur (et non au croisement des centres).
    const dLeft  = drag.rects[drag.index].left + dx;
    const dRight = dLeft + drag.rects[drag.index].width;
    const n = drag.rects.length;
    let target = drag.index;
    while (target < n - 1) {
      const nb = drag.rects[target + 1];               // voisin de droite
      if (dRight > nb.left + nb.width / 2) target++;   // moitie couverte -> il glisse a gauche
      else break;
    }
    while (target > 0) {
      const nb = drag.rects[target - 1];               // voisin de gauche
      if (dLeft < nb.left + nb.width / 2) target--;    // moitie couverte -> il glisse a droite
      else break;
    }
    drag.target = target;

    tabEls().forEach((t, i) => {
      if (i === drag.index) return;
      let shift = 0;
      if (target > drag.index && i > drag.index && i <= target) shift = -drag.w;
      else if (target < drag.index && i >= target && i < drag.index) shift = drag.w;
      t.style.transition = EASE;
      t.style.transform = shift ? ("translateX(" + shift + "px)") : "";
    });
  }

  function onTabUp() {
    window.removeEventListener("pointermove", onTabMove);
    const d = drag; drag = null;
    if (!d) return;
    if (!d.moved) { post("selectTab", d.id); return; }   // simple clic -> selection

    // L'onglet glisse jusqu'a sa place finale, puis on valide le nouvel ordre.
    const offset = (d.target - d.index) * d.w;
    d.el.style.transition = EASE;
    d.el.style.transform = "translateX(" + offset + "px)";

    const ids = tabEls().map(t => t.dataset.id);
    const [moved] = ids.splice(d.index, 1);
    ids.splice(d.target, 0, moved);
    setTimeout(() => post("reorderTabs", ids.join(",")), 175);
